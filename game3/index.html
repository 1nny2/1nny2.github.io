<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Fruitwarp Ninja — Hand Gesture Slice</title>
  <style>
    :root{
      --bg:#000;
      --hud: rgba(180, 240, 255, .92);
      --hud2: rgba(180, 240, 255, .55);
      --line: rgba(180, 240, 255, .18);
      --grid: rgba(180, 240, 255, .08);
      --ok: rgba(110, 255, 220, .95);
      --warn: rgba(255, 200, 120, .95);
      --bad: rgba(255, 120, 120, .95);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      color: white;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #stage { position: fixed; inset: 0; background: #000; }
    canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ===== HUD ===== */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      font-family: var(--mono);
      color: var(--hud);
      mix-blend-mode: screen;
    }
    #hud .frame {
      position: absolute;
      inset: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.35) inset, 0 0 22px rgba(110,255,220,.06);
    }
    #hud .grid {
      position: absolute;
      inset: 16px;
      border-radius: 16px;
      background:
        linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px;
      opacity: .55;
      mask-image: radial-gradient(circle at 50% 45%, rgba(0,0,0,1) 0%, rgba(0,0,0,.95) 40%, rgba(0,0,0,.2) 75%, rgba(0,0,0,0) 100%);
    }
    .corner { position: absolute; width: 34px; height: 34px; border: 2px solid var(--line); }
    .tl { left: 16px; top: 16px; border-right: 0; border-bottom: 0; border-top-left-radius: 16px; }
    .tr { right: 16px; top: 16px; border-left: 0; border-bottom: 0; border-top-right-radius: 16px; }
    .bl { left: 16px; bottom: 16px; border-right: 0; border-top: 0; border-bottom-left-radius: 16px; }
    .br { right: 16px; bottom: 16px; border-left: 0; border-top: 0; border-bottom-right-radius: 16px; }

    #scanlines {
      position: absolute;
      inset: 0;
      opacity: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(180,240,255,.08),
          rgba(180,240,255,.08) 1px,
          rgba(0,0,0,0) 5px,
          rgba(0,0,0,0) 10px
        );
      mix-blend-mode: screen;
      animation: scanMove 2.2s linear infinite;
      transition: opacity .18s ease;
    }
    @keyframes scanMove{ 0%{ transform: translateY(-12%);} 100%{ transform: translateY(12%);} }
    #hud.tracking #scanlines { opacity: .22; }

    #status {
      position: absolute;
      left: 30px;
      top: 28px;
      display: grid;
      gap: 10px;
      max-width: min(720px, calc(100vw - 60px));
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(180,240,255,.18);
      background: rgba(6, 16, 22, .38);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 18px rgba(110,255,220,.05);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(180,240,255,.92);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: var(--warn);
      box-shadow: 0 0 12px rgba(255,200,120,.35);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 14px rgba(110,255,220,.38); }
    .dot.bad{ background: var(--bad); box-shadow: 0 0 14px rgba(255,120,120,.38); }

    #readouts {
      display: grid;
      gap: 6px;
      font-size: 11px;
      color: rgba(180,240,255,.65);
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    #readouts b { color: rgba(180,240,255,.92); font-weight: 700; }

    #scoreboard {
      position: absolute;
      right: 30px;
      top: 28px;
      display: grid;
      gap: 10px;
      text-align: right;
    }
    #scoreboard .big {
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
    }
    #scoreboard .big span {
      color: rgba(110,255,220,.95);
      text-shadow: 0 0 14px rgba(110,255,220,.25);
    }
    #scoreboard .small {
      font-size: 11px;
      color: rgba(180,240,255,.62);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* camera frame */
    #camWrap {
      position: absolute;
      right: 26px;
      bottom: 26px;
      width: 260px;
      aspect-ratio: 4 / 3;
      border-radius: 16px;
      border: 1px solid rgba(180,240,255,.18);
      box-shadow: 0 0 28px rgba(110,255,220,.08);
      overflow: hidden;
      background: rgba(0,0,0,.55);
      pointer-events: none;
    }
    #camWrap .label, #camWrap .blade {
      position: absolute;
      top: 10px;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(180,240,255,.14);
      padding: 6px 8px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3;
    }
    #camWrap .label { left: 10px; color: rgba(180,240,255,.82); }
    #camWrap .blade { right: 10px; color: rgba(255,255,255,.85); }
    video#cam {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: .92;
      filter: contrast(108%) saturate(110%) brightness(1.02);
    }
    canvas#camOverlay {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #camWrap .scan {
      position: absolute;
      inset: -30% -10%;
      opacity: 0;
      background: linear-gradient(to bottom, transparent, rgba(110,255,220,.14), transparent);
      transform: translateY(-120%);
      z-index: 1;
    }
    #hud.tracking #camWrap .scan{
      opacity: .75;
      animation: camSweep 1.35s linear infinite;
    }
    @keyframes camSweep { 0%{ transform: translateY(-120%);} 100%{ transform: translateY(200%);} }

    /* start overlay */
    #overlay {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      pointer-events: auto;
      background: radial-gradient(circle at 50% 40%, rgba(110,255,220,.10), rgba(0,0,0,.92) 55%, rgba(0,0,0,1) 100%);
    }
    #card {
      width: min(760px, calc(100vw - 40px));
      border-radius: 18px;
      border: 1px solid rgba(180,240,255,.18);
      background: rgba(0,0,0,.48);
      box-shadow: 0 0 48px rgba(110,255,220,.08);
      padding: 18px 18px 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-family: var(--sans);
      color: rgba(255,255,255,.90);
    }
    #card h1{ margin: 0 0 10px; font-size: 20px; font-weight: 700; }
    #card p{ margin: 8px 0; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.72); }
    #card .row{ display:flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; justify-content: space-between; }
    #card .modes{ display:flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .modeBtn{
      pointer-events: auto;
      cursor: pointer;
      flex: 1 1 200px;
      border: 1px solid rgba(180,240,255,.22);
      background: rgba(180,240,255,.06);
      color: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: left;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
      font-family: var(--sans);
    }
    .modeBtn .t{ display:block; font-size: 15px; margin-bottom: 4px; }
    .modeBtn .d{ display:block; font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: .03em; color: rgba(180,240,255,.65); }
    .modeBtn:hover{ transform: translateY(-1px); background: rgba(180,240,255,.10); border-color: rgba(180,240,255,.35); }
    .modeBtn:active{ transform: translateY(0px); }
    .modeBtn:disabled{ opacity: .45; cursor: not-allowed; transform: none; }
    #mouseBtn{ border-color: rgba(110,255,220,.35); background: rgba(110,255,220,.10); box-shadow: 0 0 24px rgba(110,255,220,.10); }
    #mouseBtn:hover{ background: rgba(110,255,220,.16); border-color: rgba(110,255,220,.45); }
    #gestureBtn{ border-color: rgba(255,200,120,.30); background: rgba(255,200,120,.08); box-shadow: 0 0 24px rgba(255,200,120,.08); }
    #gestureBtn:hover{ background: rgba(255,200,120,.14); border-color: rgba(255,200,120,.45); }
    #note { font-family: var(--mono); font-size: 11px; color: rgba(180,240,255,.65); letter-spacing: .05em; }
    #note code{
      color: rgba(180,240,255,.90);
      background: rgba(180,240,255,.08);
      border: 1px solid rgba(180,240,255,.10);
      padding: 1px 6px;
      border-radius: 10px;
    }
    #banner {
      margin-top: 10px;
      display: none;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.86);
      border: 1px solid rgba(255,200,120,.25);
      background: rgba(40, 20, 0, .35);
      padding: 10px 12px;
      border-radius: 14px;
    }
    #banner strong{ color: rgba(255,200,120,.95); }

    /* hit flash */
    #flash {
      position: fixed; inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.22), rgba(110,255,220,.09) 18%, rgba(0,0,0,0) 52%);
      transition: opacity .10s ease;
      mix-blend-mode: screen;
    }
    #flash.on { opacity: 1; }

    /* game over */
    #gameOver {
      position: fixed; inset: 0;
      display: none; place-items: center;
      pointer-events: auto;
      background: radial-gradient(circle at 50% 40%, rgba(255,120,120,.10), rgba(0,0,0,.92) 60%, rgba(0,0,0,1) 100%);
      font-family: var(--sans);
    }
    #gameOver .box{
      width: min(560px, calc(100vw - 40px));
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.50);
      box-shadow: 0 0 42px rgba(255,120,120,.10);
      padding: 18px 18px 16px;
      color: rgba(255,255,255,.90);
    }
    #gameOver .box h2{ margin: 0 0 10px; }
    #restartBtn, #menuBtn{
      cursor:pointer;
      border: 1px solid rgba(180,240,255,.18);
      background: rgba(180,240,255,.08);
      color: rgba(255,255,255,.92);
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .15s ease, border-color .15s ease;
    }
    #restartBtn:hover, #menuBtn:hover{ background: rgba(180,240,255,.14); border-color: rgba(180,240,255,.35); }
    #menuBtn{ border-color: rgba(255,200,120,.25); background: rgba(255,200,120,.08); }
    #menuBtn:hover{ background: rgba(255,200,120,.14); border-color: rgba(255,200,120,.40); }

    @media (max-width: 720px){
      #camWrap{ width: 200px; right: 18px; bottom: 18px; }
      #status{ left: 20px; top: 20px; }
      #scoreboard{ right: 20px; top: 20px; }
    }
    #camWrap { display: none; }
    #loadingPanel { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(0,0,0,.5); font-family: var(--sans); }
    #loadingPanel[hidden], #playMenuBtn[hidden] { display: none; }
    .loadingBox { max-width: min(460px, calc(100vw - 64px)); padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: #061016; color: var(--hud); }
    .loadingHint { font-size: 13px; line-height: 1.6; color: var(--hud2); }
    #cancelLoadBtn, #playMenuBtn { min-height: 44px; padding: 8px 16px; color: var(--hud); background: #10212b; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
    #playMenuBtn { position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); left: 26px; z-index: 5; }
    #banner { white-space: pre-line; }
    @media (pointer: coarse) {
      #hud { mix-blend-mode: normal; }
      #scanlines, #camWrap .scan { display: none; }
      #camWrap { width: 144px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); }
      #camWrap .label { display: none; }
      .pill, #camWrap .blade { backdrop-filter: none; -webkit-backdrop-filter: none; }
      #card { max-height: calc(100dvh - 32px); overflow-y: auto; box-sizing: border-box; touch-action: pan-y; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>

    <div id="hud">
      <div id="scanlines"></div>
      <div class="frame"></div>
      <div class="grid"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <div id="status">
        <div class="pill"><span class="dot" id="dot"></span><span id="scanText">SCANNER IDLE</span></div>
        <div id="readouts">
          <div>Blade: <b id="bladeState">OFF</b> · Gesture: <b id="gestureText">—</b></div>
          <div>Combo: <b id="comboText">x1</b> · Miss: <b id="missText">0/3</b></div>
        </div>
      </div>

      <div id="scoreboard">
        <div class="big">Score <span id="scoreText">0</span></div>
        <div class="small" id="fpsText">— fps</div>
      </div>

      <div id="camWrap">
        <div class="scan"></div>
        <div class="label">CAM</div>
        <div class="blade" id="camBlade">BLADE OFF</div>
        <video id="cam" autoplay playsinline webkit-playsinline muted></video>
        <canvas id="camOverlay"></canvas>
      </div>
    </div>

    <div id="flash"></div>
    <button id="playMenuBtn" hidden>返回菜单</button>
    <div id="loadingPanel" hidden role="status" aria-live="polite">
      <div class="loadingBox">
        <p id="loadingText">正在准备手势识别…</p>
        <p class="loadingHint">准备完成后才会开始计分，可随时返回选择触屏模式。</p>
        <button id="cancelLoadBtn">返回菜单</button>
      </div>
    </div>

    <div id="overlay">
      <div id="card">
        <h1>Fruitwarp Ninja · 手势切割水果</h1>
        <p>选择你的操控方式，切开飞来的水果，避免切到炸弹。</p>
        <div class="modes">
          <button class="modeBtn" id="mouseBtn">
            <span class="t">鼠标 / 触屏模式</span>
            <span class="d">移动鼠标或用手指滑动即可切割，无需相机。</span>
          </button>
          <button class="modeBtn" id="gestureBtn">
            <span class="t">手势模式</span>
            <span class="d">用食指当光刀：张开手掌=ON · 握拳=OFF。需相机权限。</span>
          </button>
        </div>
        <div class="row">
          <div id="note">手势模式需 <code>https</code> 或 <code>http://localhost</code> 打开并授权相机。</div>
        </div>
        <div id="banner"></div>
      </div>
    </div>

    <div id="gameOver">
      <div class="box">
        <h2>GAME OVER</h2>
        <div style="opacity:.85; line-height:1.6">
          <div>Final Score: <b id="finalScore">0</b></div>
          <div>Best Combo: <b id="bestCombo">x1</b></div>
        </div>
        <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
          <button id="restartBtn">RESTART</button>
          <button id="menuBtn">返回菜单</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "./assets/three.module.js";
    import { GestureTracker } from "./gesture-tracker.js";

    const mobile = matchMedia("(pointer: coarse)").matches;

    // ============================================================
    // CONFIG (tuning)
    // ============================================================
    const CFG = {
      DPR_MAX: mobile ? 1.25 : 1.75,
      BG: 0x000000,

      // Ortho world
      WORLD_Y: 1.0,     // top=+1, bottom=-1

      // ✅ Make fruits NOT exceed the top edge:
      // We lowered launch velocity range and also added a hard top clamp.
      TOP_MARGIN: 0.02,        // never cross top boundary (WORLD_Y - r - margin)
      TOP_BOUNCE: 0.12,        // tiny downward nudge if touching top

      // Physics (tuned to keep peak below top & less "too fast")
      GRAVITY: -2.10,          // keep decent hang time
      LAUNCH_VY_MIN: 2.10,     // lowered peak height
      LAUNCH_VY_MAX: 2.85,
      LAUNCH_VX: 0.62,         // slightly slower horizontal speed
      OUT_KILL_Y: -1.58,

      // Spawning / difficulty
      SPAWN_BASE: 1.00,
      SPAWN_MIN: 0.48,
      DIFFICULTY_RAMP: 0.988,
      MULTI_CHANCE: 0.20,
      BOMB_CHANCE: 0.10,

      // Fruit visuals/physics
      FRUIT_R_MIN: 0.11,
      FRUIT_R_MAX: 0.15,
      SPIN: 3.2,

      // Slice responsiveness & leniency
      SLICE_SPEED_MIN: 0.40,
      SLICE_HOLD_MS: 180,
      HAND_LOST_MS: 220,

      // Hand smoothing (reduce latency)
      HAND_RESPONSE_MS: 28,
      OPEN_EXTENDED_MIN: 3,
      FIST_EXTENDED_MAX: 1,

      // Ribbon trail
      TRAIL_POINTS: 54,
      TRAIL_WIDTH_BASE: 0.070,
      TRAIL_WIDTH_SPEED: 0.050,
      TRAIL_ALPHA_ON: 1.0,
      TRAIL_ALPHA_OFF: 0.20,
      TRAIL_GLOW_K: 10.0,
      TRAIL_TAPER_POW: 1.7,
      TRAIL_FALLBACK_HIDE_MS: 220,

      // Sparks
      SPARKS_PER_SLICE: mobile ? 10 : 18,
      SPARK_LIFE: 0.55,

      // Camera overlay
      CAM_DRAW_GRID: false,
      CAM_OVERLAY_POINTS: true,
    };

    // ============================================================
    // DOM
    // ============================================================
    const canvas = document.getElementById("gl");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("mouseBtn");
    const gestureBtn = document.getElementById("gestureBtn");
    const banner = document.getElementById("banner");

    const hud = document.getElementById("hud");
    const dot = document.getElementById("dot");
    const scanText = document.getElementById("scanText");
    const bladeStateEl = document.getElementById("bladeState");
    const gestureTextEl = document.getElementById("gestureText");
    const comboTextEl = document.getElementById("comboText");
    const missTextEl = document.getElementById("missText");

    const scoreText = document.getElementById("scoreText");
    const fpsText = document.getElementById("fpsText");

    const flash = document.getElementById("flash");

    const camWrap = document.getElementById("camWrap");
    const camEl = document.getElementById("cam");
    const camBlade = document.getElementById("camBlade");
    const camOverlay = document.getElementById("camOverlay");
    const camCtx = camOverlay.getContext("2d");

    const gameOver = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");
    const bestComboEl = document.getElementById("bestCombo");
    const restartBtn = document.getElementById("restartBtn");
    const menuBtn = document.getElementById("menuBtn");

    // ============================================================
    // Utils
    // ============================================================
    const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
    const lerp = (a,b,t)=>a+(b-a)*t;
    const nowMs = ()=>performance.now();

    function segCircle(p1, p2, c, r){
      const vx = p2.x - p1.x, vy = p2.y - p1.y;
      const wx = c.x - p1.x, wy = c.y - p1.y;
      const vv = vx*vx + vy*vy;
      if (vv < 1e-6) return ((wx*wx + wy*wy) <= r*r);
      let t = (wx*vx + wy*vy) / vv;
      t = clamp(t, 0, 1);
      const px = p1.x + t*vx, py = p1.y + t*vy;
      const dx = c.x - px, dy = c.y - py;
      return (dx*dx + dy*dy) <= r*r;
    }

    // ============================================================
    // Three.js
    // ============================================================
    let renderer, scene, camera, aspect = innerWidth / innerHeight;
    let root, sparksGroup;

    let bladeCursor;
    let trailMesh, trailMat, trailGeo;
    let trailWidth = CFG.TRAIL_WIDTH_BASE;

    const fruitTypes = ["apple","orange","lemon","melon"];
    const fruitTex = new Map();
    const halfTexCache = new Map();
    let bombTex = null;
    let sparkTex = null;

    function screenToWorld(nx, ny){
      const x = lerp(-aspect, aspect, nx);
      const y = lerp(CFG.WORLD_Y, -CFG.WORLD_Y, ny);
      return { x, y };
    }

    function initThree(){
      renderer = new THREE.WebGLRenderer({ canvas, antialias: !mobile, alpha: false, powerPreference: "high-performance" });
      renderer.setClearColor(CFG.BG, 1);
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.DPR_MAX));
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(CFG.BG);

      root = new THREE.Group();
      scene.add(root);

      sparksGroup = new THREE.Group();
      scene.add(sparksGroup);

      initTextures();
      initBackdrop();
      initTrailRibbon();
      initBladeCursor();

      onResize();
      addEventListener("resize", onResize, { passive: true });
    }

    function onResize(){
      aspect = innerWidth / innerHeight;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, CFG.DPR_MAX));
      renderer.setSize(innerWidth, innerHeight, false);

      camera = new THREE.OrthographicCamera(-aspect, aspect, CFG.WORLD_Y, -CFG.WORLD_Y, 0.01, 100);
      camera.position.set(0, 0, 10);
      camera.lookAt(0, 0, 0);

      const rect = camWrap.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio||1, 1.5);
      camOverlay.width = Math.floor(rect.width * dpr);
      camOverlay.height = Math.floor(rect.height * dpr);
    }

    function initBackdrop(){
      const N = mobile ? 500 : 1000;
      const pos = new Float32Array(N*3);
      const col = new Float32Array(N*3);
      for(let i=0;i<N;i++){
        const x = (Math.random()*2-1) * aspect * 1.15;
        const y = (Math.random()*2-1) * 1.15;
        const z = -Math.random()*0.6;
        pos[i*3+0]=x; pos[i*3+1]=y; pos[i*3+2]=z;
        const c = 0.45 + Math.random()*0.35;
        col[i*3+0]=c; col[i*3+1]=c; col[i*3+2]=c;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(pos,3));
      g.setAttribute("color", new THREE.BufferAttribute(col,3));
      const m = new THREE.PointsMaterial({
        size: 0.010,
        vertexColors: true,
        transparent: true,
        opacity: 0.55,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const pts = new THREE.Points(g,m);
      pts.position.z = -0.5;
      scene.add(pts);
    }

    // ============================================================
    // Ribbon Trail
    // ============================================================
    const trail = new Array(CFG.TRAIL_POINTS).fill(0).map(()=>({x:999,y:999,t:0}));
    let trailHead = 0;
    let lastTrailTime = 0;

    function initTrailRibbon(){
      const N = CFG.TRAIL_POINTS;
      const pos = new Float32Array(N * 2 * 3);
      const uv  = new Float32Array(N * 2 * 2);

      const idx = [];
      for(let i=0;i<N-1;i++){
        const a = i*2, b=a+1, c=a+2, d=a+3;
        idx.push(a,b,c,  b,d,c);
      }

      trailGeo = new THREE.BufferGeometry();
      trailGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      trailGeo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      trailGeo.setIndex(idx);

      trailMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uAlpha: { value: 0.0 },
          uGlowK: { value: CFG.TRAIL_GLOW_K },
          uTaperPow: { value: CFG.TRAIL_TAPER_POW },
          uC1: { value: new THREE.Color(0.35, 0.95, 1.00) },
          uC2: { value: new THREE.Color(1.00, 1.00, 1.00) },
        },
        vertexShader: /*glsl*/`
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /*glsl*/`
          uniform float uAlpha;
          uniform float uGlowK;
          uniform float uTaperPow;
          uniform vec3  uC1;
          uniform vec3  uC2;
          varying vec2 vUv;
          void main(){
            float d = abs(vUv.x - 0.5) * 2.0;
            float glow = exp(-uGlowK * d * d);
            float taper = pow(clamp(vUv.y, 0.0, 1.0), uTaperPow);
            vec3 col = mix(uC1, uC2, pow(taper, 0.75));
            float a = glow * taper * uAlpha;
            gl_FragColor = vec4(col * (glow*1.25 + 0.25), a);
          }
        `
      });

      trailMesh = new THREE.Mesh(trailGeo, trailMat);
      trailMesh.renderOrder = 10;
      trailMesh.frustumCulled = false;
      scene.add(trailMesh);

      clearTrail();
    }

    function clearTrail(){
      trailHead = 0;
      for(const p of trail) { p.x = 999; p.y = 999; p.t = 0; }
      const pos = trailGeo.getAttribute("position");
      const uv = trailGeo.getAttribute("uv");
      for(let i=0;i<CFG.TRAIL_POINTS;i++){
        pos.array[(i*2+0)*3+0] = 999;
        pos.array[(i*2+0)*3+1] = 999;
        pos.array[(i*2+0)*3+2] = 0.02;

        pos.array[(i*2+1)*3+0] = 999;
        pos.array[(i*2+1)*3+1] = 999;
        pos.array[(i*2+1)*3+2] = 0.02;

        const v = i/(CFG.TRAIL_POINTS-1);
        uv.array[(i*2+0)*2+0] = 0.0;
        uv.array[(i*2+0)*2+1] = v;
        uv.array[(i*2+1)*2+0] = 1.0;
        uv.array[(i*2+1)*2+1] = v;
      }
      pos.needsUpdate = true;
      uv.needsUpdate = true;
    }

    function pushTrailPoint(x, y, t){
      if(!trail.some(p => p.t > 0)) for(const p of trail) { p.x = x; p.y = y; p.t = t; }
      trail[trailHead].x = x;
      trail[trailHead].y = y;
      trail[trailHead].t = t;
      trailHead = (trailHead + 1) % trail.length;
      lastTrailTime = t;

      const pos = trailGeo.getAttribute("position");
      const uv = trailGeo.getAttribute("uv");
      const N = trail.length;

      for(let i=0;i<N;i++){
        const src = (trailHead - 1 - i + N) % N;
        const p0 = trail[(src + 1) % N];
        const p1 = trail[src];
        const p2 = trail[(src - 1 + N) % N];

        const x1 = p1.x, y1 = p1.y;

        let tx = (p0.x - p2.x);
        let ty = (p0.y - p2.y);
        const tl = Math.hypot(tx, ty) || 1.0;
        tx /= tl; ty /= tl;

        const nx = -ty, ny = tx;

        const v = 1.0 - (i/(N-1));
        const w = trailWidth * (0.25 + 0.75 * Math.pow(v, 0.9));

        const lx = x1 - nx*w, ly = y1 - ny*w;
        const rx = x1 + nx*w, ry = y1 + ny*w;

        const vi0 = i*2+0;
        const vi1 = i*2+1;

        pos.array[vi0*3+0] = lx;
        pos.array[vi0*3+1] = ly;
        pos.array[vi0*3+2] = 0.03;

        pos.array[vi1*3+0] = rx;
        pos.array[vi1*3+1] = ry;
        pos.array[vi1*3+2] = 0.03;

        uv.array[vi0*2+0] = 0.0;
        uv.array[vi0*2+1] = v;
        uv.array[vi1*2+0] = 1.0;
        uv.array[vi1*2+1] = v;
      }

      pos.needsUpdate = true;
      uv.needsUpdate = true;
    }

    function initBladeCursor(){
      bladeCursor = makeSprite(sparkTex);
      bladeCursor.scale.set(0.20, 0.20, 1);
      bladeCursor.material.color = new THREE.Color(0.45, 0.95, 1.0);

    // ============================================================
    // Procedural textures
    // ============================================================
    function makeCanvas(size=256){
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      return { c, ctx };
    }
    function circle(ctx, x, y, r){
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.closePath();
    }

    function drawFruitTexture(type, size=256){
      const { c, ctx } = makeCanvas(size);
      ctx.clearRect(0,0,size,size);

      ctx.save();
      ctx.translate(size/2, size/2);
      const sh = ctx.createRadialGradient(0,0,size*0.12, 0,0,size*0.52);
      sh.addColorStop(0, "rgba(0,0,0,0)");
      sh.addColorStop(1, "rgba(0,0,0,0.35)");
      ctx.fillStyle = sh;
      circle(ctx, 0, 0, size*0.49);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(size/2, size/2);

      if(type === "apple"){
        const g = ctx.createRadialGradient(-size*0.12,-size*0.15, size*0.06, 0,0,size*0.55);
        g.addColorStop(0, "rgba(255,255,255,0.25)");
        g.addColorStop(0.18, "rgba(255,90,90,1)");
        g.addColorStop(0.75, "rgba(175,25,25,1)");
        g.addColorStop(1, "rgba(90,10,10,1)");
        ctx.fillStyle = g; circle(ctx, 0, 0, size*0.44); ctx.fill();

        ctx.globalAlpha = 0.18; ctx.fillStyle = "rgba(255,220,220,1)";
        for(let i=0;i<48;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.6)*size*0.33;
          circle(ctx, Math.cos(a)*rr, Math.sin(a)*rr, 1 + Math.random()*1.6); ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.rotate(-0.5);
        ctx.fillStyle = "rgba(80,210,110,1)";
        ctx.beginPath();
        ctx.ellipse(size*0.07, -size*0.36, size*0.10, size*0.05, 0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.rotate(0.5);

        ctx.strokeStyle = "rgba(120,70,30,1)";
        ctx.lineWidth = 10; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(0, -size*0.36); ctx.lineTo(size*0.02, -size*0.48); ctx.stroke();

        const h = ctx.createRadialGradient(-size*0.16,-size*0.16, size*0.02, -size*0.12,-size*0.10, size*0.26);
        h.addColorStop(0, "rgba(255,255,255,0.35)");
        h.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, size*0.30); ctx.fill();
      }

      if(type === "orange"){
        const g = ctx.createRadialGradient(-size*0.14,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,255,255,0.18)");
        g.addColorStop(0.22, "rgba(255,170,60,1)");
        g.addColorStop(0.75, "rgba(220,95,18,1)");
        g.addColorStop(1, "rgba(120,40,8,1)");
        ctx.fillStyle = g; circle(ctx, 0, 0, size*0.44); ctx.fill();

        ctx.globalAlpha = 0.22; ctx.fillStyle = "rgba(255,220,150,1)";
        for(let i=0;i<90;i++){
          const a = Math.random()*Math.PI*2;
          const rr = (Math.random()**0.7)*size*0.33;
          circle(ctx, Math.cos(a)*rr, Math.sin(a)*rr, 0.8 + Math.random()*1.4); ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "rgba(255,255,255,0.07)";
        circle(ctx, 0, -size*0.34, size*0.07); ctx.fill();

        const h = ctx.createRadialGradient(-size*0.18,-size*0.18, size*0.02, -size*0.12,-size*0.10, size*0.26);
        h.addColorStop(0, "rgba(255,255,255,0.28)");
        h.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, size*0.30); ctx.fill();
      }

      if(type === "lemon"){
        const g = ctx.createRadialGradient(-size*0.12,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,255,255,0.18)");
        g.addColorStop(0.24, "rgba(255,235,90,1)");
        g.addColorStop(0.78, "rgba(215,175,18,1)");
        g.addColorStop(1, "rgba(120,95,10,1)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0,0, size*0.44, size*0.38, 0.2, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.06)";
        circle(ctx, -size*0.36, 0, size*0.07); ctx.fill();
        circle(ctx,  size*0.36, 0, size*0.07); ctx.fill();

        const h = ctx.createRadialGradient(-size*0.18,-size*0.18, size*0.02, -size*0.12,-size*0.10, size*0.26);
        h.addColorStop(0, "rgba(255,255,255,0.25)");
        h.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, size*0.30); ctx.fill();
      }

      if(type === "melon"){
        const g = ctx.createRadialGradient(-size*0.12,-size*0.16, size*0.06, 0,0,size*0.58);
        g.addColorStop(0, "rgba(255,255,255,0.15)");
        g.addColorStop(0.22, "rgba(120,220,120,1)");
        g.addColorStop(0.78, "rgba(30,120,40,1)");
        g.addColorStop(1, "rgba(10,60,18,1)");
        ctx.fillStyle = g; circle(ctx, 0,0, size*0.44); ctx.fill();

        ctx.globalAlpha = 0.25;
        ctx.strokeStyle = "rgba(10,60,18,1)";
        ctx.lineWidth = 10;
        for(let i=-4;i<=4;i++){
          ctx.beginPath();
          ctx.arc(0,0, size*0.40, (i*0.35)+0.2, (i*0.35)+0.65);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        const h = ctx.createRadialGradient(-size*0.18,-size*0.18, size*0.02, -size*0.12,-size*0.10, size*0.26);
        h.addColorStop(0, "rgba(255,255,255,0.22)");
        h.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, size*0.30); ctx.fill();
      }

      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      const m = ctx.createRadialGradient(size/2,size/2, size*0.10, size/2,size/2, size*0.50);
      m.addColorStop(0, "rgba(0,0,0,1)");
      m.addColorStop(0.95, "rgba(0,0,0,1)");
      m.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = m;
      circle(ctx, size/2, size/2, size*0.50);
      ctx.fill();
      ctx.restore();

      return c;
    }

    function drawBombTexture(size=256){
      const { c, ctx } = makeCanvas(size);
      ctx.clearRect(0,0,size,size);

      ctx.save();
      ctx.translate(size/2,size/2);

      const g = ctx.createRadialGradient(-size*0.12,-size*0.16, size*0.06, 0,0,size*0.58);
      g.addColorStop(0, "rgba(255,255,255,0.18)");
      g.addColorStop(0.22, "rgba(60,60,70,1)");
      g.addColorStop(0.78, "rgba(10,10,12,1)");
      g.addColorStop(1, "rgba(0,0,0,1)");
      ctx.fillStyle = g; circle(ctx,0,0,size*0.44); ctx.fill();

      ctx.strokeStyle = "rgba(255,80,80,0.9)";
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(0,0,size*0.30,0,Math.PI*2); ctx.stroke();

      ctx.strokeStyle = "rgba(180,140,80,1)";
      ctx.lineWidth = 10; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(size*0.10, -size*0.40); ctx.lineTo(size*0.18, -size*0.52); ctx.stroke();

      ctx.fillStyle = "rgba(255,210,120,1)";
      circle(ctx, size*0.22, -size*0.56, size*0.04); ctx.fill();
      ctx.fillStyle = "rgba(255,120,80,1)";
      circle(ctx, size*0.26, -size*0.60, size*0.02); ctx.fill();

      const h = ctx.createRadialGradient(-size*0.18,-size*0.18, size*0.02, -size*0.12,-size*0.10, size*0.26);
      h.addColorStop(0, "rgba(255,255,255,0.22)");
      h.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = h; circle(ctx, -size*0.12, -size*0.12, size*0.30); ctx.fill();

      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = "destination-in";
      const m = ctx.createRadialGradient(size/2,size/2, size*0.10, size/2,size/2, size*0.50);
      m.addColorStop(0, "rgba(0,0,0,1)");
      m.addColorStop(0.95, "rgba(0,0,0,1)");
      m.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = m;
      circle(ctx, size/2, size/2, size*0.50);
      ctx.fill();
      ctx.restore();

      return c;
    }

    function drawSparkTexture(size=128){
      const { c, ctx } = makeCanvas(size);
      ctx.clearRect(0,0,size,size);
      ctx.save();
      ctx.translate(size/2,size/2);
      const g = ctx.createRadialGradient(0,0, 0, 0,0, size*0.48);
      g.addColorStop(0, "rgba(255,255,255,0.95)");
      g.addColorStop(0.18, "rgba(255,255,255,0.45)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      circle(ctx,0,0,size*0.48);
      ctx.fill();
      ctx.restore();
      return c;
    }

    function initTextures(){
      for(const t of fruitTypes){
        const cnv = drawFruitTexture(t, 256);
        const tex = new THREE.CanvasTexture(cnv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        fruitTex.set(t, tex);
      }
      bombTex = new THREE.CanvasTexture(drawBombTexture(256));
      bombTex.colorSpace = THREE.SRGBColorSpace;
      bombTex.anisotropy = 4;

      sparkTex = new THREE.CanvasTexture(drawSparkTexture(128));
      sparkTex.colorSpace = THREE.SRGBColorSpace;
      sparkTex.anisotropy = 2;
    }

    function getHalfTexture(type, side){
      const key = `${type}:${side}`;
      if(halfTexCache.has(key)) return halfTexCache.get(key);

      const base = drawFruitTexture(type, 256);
      const { c, ctx } = makeCanvas(256);
      ctx.clearRect(0,0,256,256);
      ctx.save();
      ctx.beginPath();
      if(side === "L") ctx.rect(0,0,128,256);
      else ctx.rect(128,0,128,256);
      ctx.clip();
      ctx.drawImage(base, 0, 0);
      ctx.restore();

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = "rgba(255,255,255,0.22)";
      ctx.lineWidth = 6;
      ctx.beginPath();
      const x = 128;
      ctx.moveTo(x, 44);
      ctx.lineTo(x, 212);
      ctx.stroke();
      ctx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      halfTexCache.set(key, tex);
      return tex;
    }

    // ============================================================
    // Sprites & game objects
    // ============================================================
    const fruits = [];
    const halves = [];
    const sparks = [];

    function makeSprite(texture){
      const mat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        opacity: 1.0
      });
      const sp = new THREE.Sprite(mat);
      sp.position.z = 0;
      return sp;
    }

    function spawnFruit(isBomb=false){
      const type = isBomb ? "bomb" : fruitTypes[(Math.random()*fruitTypes.length)|0];
      const r = isBomb ? lerp(0.12, 0.16, Math.random()) : lerp(CFG.FRUIT_R_MIN, CFG.FRUIT_R_MAX, Math.random());
      const x = (Math.random()*2 - 1) * (aspect * 0.85);
      const y = -CFG.WORLD_Y - 0.22;

      // ✅ lowered VY => peak won't exceed top
      const vy = lerp(CFG.LAUNCH_VY_MIN, CFG.LAUNCH_VY_MAX, Math.random());
      const vx = (Math.random()*2 - 1) * CFG.LAUNCH_VX;
      const spin = (Math.random()*2 - 1) * CFG.SPIN;

      const sprite = makeSprite(isBomb ? bombTex : fruitTex.get(type));
      sprite.scale.set(r*2, r*2, 1);
      sprite.position.set(x, y, 0);

      const obj = {
        isBomb,
        type,
        r,
        x, y,
        vx, vy,
        spin,
        rot: Math.random()*Math.PI*2,
        sliced: false,
        missable: !isBomb,
        sprite
      };
      sprite.material.rotation = obj.rot;

      root.add(sprite);
      fruits.push(obj);
    }

    function spawnHalves(fruit, cutDir){
      const nx = -cutDir.dy, ny = cutDir.dx;
      const push = fruit.r * 0.28;

      const leftTex = getHalfTexture(fruit.type, "L");
      const rightTex = getHalfTexture(fruit.type, "R");

      const a = makeSprite(leftTex);
      const b = makeSprite(rightTex);

      a.scale.set(fruit.r*2, fruit.r*2, 1);
      b.scale.set(fruit.r*2, fruit.r*2, 1);

      a.position.set(fruit.x - nx*push, fruit.y - ny*push, 0);
      b.position.set(fruit.x + nx*push, fruit.y + ny*push, 0);

      const baseVx = fruit.vx;
      const baseVy = fruit.vy;

      const kick = 0.85;
      const upKick = 0.35;

      const ha = {
        x: a.position.x, y: a.position.y,
        vx: baseVx - nx*kick, vy: baseVy - ny*kick + upKick,
        rot: fruit.rot, spin: fruit.spin * 1.1,
        life: 1.2, sprite: a
      };
      const hb = {
        x: b.position.x, y: b.position.y,
        vx: baseVx + nx*kick, vy: baseVy + ny*kick + upKick,
        rot: fruit.rot, spin: -fruit.spin * 1.05,
        life: 1.2, sprite: b
      };

      a.material.rotation = ha.rot;
      b.material.rotation = hb.rot;

      root.add(a);
      root.add(b);
      halves.push(ha, hb);
    }

    function fruitColor(type){
      if(type === "apple") return { r: 1.0, g: 0.35, b: 0.25 };
      if(type === "orange") return { r: 1.0, g: 0.62, b: 0.22 };
      if(type === "lemon") return { r: 1.0, g: 0.92, b: 0.35 };
      if(type === "melon") return { r: 0.55, g: 1.0, b: 0.55 };
      return { r: 0.95, g: 0.95, b: 1.0 };
    }

    function spawnSparks(x, y, color){
      for(let i=0;i<CFG.SPARKS_PER_SLICE;i++){
        const sp = makeSprite(sparkTex);
        sp.material.opacity = 0.0;
        sp.material.color = new THREE.Color(color.r, color.g, color.b);
        sp.scale.set(0.11, 0.11, 1);
        sp.position.set(x, y, 0.01);

        const a = Math.random()*Math.PI*2;
        const s = 0.65 + Math.random()*1.55;

        sparksGroup.add(sp);
        sparks.push({
          x, y,
          vx: Math.cos(a)*s*0.55,
          vy: Math.sin(a)*s*0.55 + 0.42,
          life: CFG.SPARK_LIFE,
          sprite: sp
        });
      }
    }

    // ============================================================
    // MediaPipe Hands
    // ============================================================
    let sessionId = 0;
    let loading = false;
    let cameraStream = null;
    const loadingPanel = document.getElementById("loadingPanel");
    const loadingText = document.getElementById("loadingText");
    const playMenuBtn = document.getElementById("playMenuBtn");
    const tracker = new GestureTracker({
      mobile,
      onResult: (result, t) => updateHand(result, t),
      onProgress: text => { if(loading) loadingText.textContent = text; },
      onError: error => {
        backToMenu();
        bannerMsg(cameraErrorMessage(error));
      }
    });

    const hand = {
      ready: false,
      detected: false,
      lastSeen: 0,
      fx: 0.5, fy: 0.5,
      fxT: 0.5, fyT: 0.5,
      wx: 0, wy: 0,
      gesture: "NONE",
      bladeOn: false
    };

    // 鼠标/触摸输入 — 作为主输入或相机不可用时的回退
    const mouse = { x: 0, y: 0, inside: false };

    function initMouseInput(){
      const handleMove = (e) => {
        const nx = e.clientX / innerWidth;
        const ny = e.clientY / innerHeight;
        const w = screenToWorld(nx, ny);
        mouse.x = w.x;
        mouse.y = w.y;
        mouse.inside = true;
      };
      canvas.addEventListener("pointermove", handleMove, { passive: true });
      canvas.addEventListener("pointerdown", e => {
        canvas.setPointerCapture(e.pointerId);
        handleMove(e);
      }, { passive: true });
      canvas.addEventListener("pointerup", e => { if(e.pointerType !== "mouse") mouse.inside = false; }, { passive: true });
      canvas.addEventListener("pointercancel", () => { mouse.inside = false; }, { passive: true });
      canvas.addEventListener("pointerleave", () => { mouse.inside = false; }, { passive: true });
      canvas.addEventListener("pointerenter", () => { mouse.inside = true; }, { passive: true });
    }

    function bannerMsg(text){
      banner.style.display = "block";
      banner.textContent = text;
    }

    function cameraErrorMessage(error){
      if(!window.isSecureContext) return "手机相机需要 HTTPS 安全连接。请使用 HTTPS 网站地址；手机访问电脑的 http://192.168… 地址无法启用摄像头。当前仍可使用鼠标 / 触屏模式。";
      if(!navigator.mediaDevices?.getUserMedia) return "当前浏览器不支持摄像头。请用最新版 Safari、Chrome 或 Edge 打开 HTTPS 网站；如果在应用内打开，请选择在系统浏览器中打开。";
      if(error.name === "NotAllowedError" || error.name === "SecurityError") return "相机权限被拒绝。请在浏览器的网站设置中允许相机后重试；应用内浏览器请改用 Safari 或 Chrome。";
      if(error.name === "NotFoundError") return "未找到可用摄像头，请检查设备相机后重试。";
      if(error.name === "NotReadableError" || error.name === "AbortError") return "相机无法启动，可能被其他应用占用。请关闭其他使用相机的应用后重试。";
      return "手势模式启动失败：" + String(error.message || error) + "。可返回菜单重试，或使用鼠标 / 触屏模式。";
    }

    function withTimeout(promise, ms, message){
      let timer;
      return Promise.race([promise, new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), ms);
      })]).finally(() => clearTimeout(timer));
    }

    async function initMediaPipeAndCamera(id){
      if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        throw new Error("当前环境不支持安全访问相机");
      }
      camEl.muted = true;
      camEl.autoplay = true;
      camEl.playsInline = true;
      loadingText.textContent = "请允许相机权限，正在准备手势识别…";
      let cancelled = false;
      // Camera permission is requested directly from the button click. Model
      // initialization proceeds in parallel, rather than after camera startup.
      const cameraReady = (async () => {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "user" }, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } },
            audio: false
          });
        } catch(error) {
          if(id !== sessionId || cancelled) return;
          if(error.name !== "OverconstrainedError") throw error;
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        }
        if(id !== sessionId || cancelled){ stream.getTracks().forEach(track => track.stop()); return; }
        cameraStream = stream;
        stream.getVideoTracks().forEach(track => track.addEventListener("ended", () => {
          if(id !== sessionId) return;
          backToMenu();
          bannerMsg("相机已断开，请检查相机权限并重新进入手势模式。");
        }, { once: true }));
        camEl.srcObject = stream;
        camWrap.style.display = "block";
        onResize();
        await withTimeout(camEl.play(), 12000, "相机播放超时，请在系统浏览器中重试");
        if(id !== sessionId || cancelled) return;
        if(camEl.readyState < 2) {
          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => { cleanup(); reject(new Error("相机画面加载超时")); }, 10000);
            const ready = () => { cleanup(); resolve(); };
            const cleanup = () => { clearTimeout(timer); camEl.removeEventListener("loadeddata", ready); };
            camEl.addEventListener("loadeddata", ready, { once: true });
          });
        }
        if(id === sessionId && !cancelled) loadingText.textContent = "相机已就绪，正在等待手势模型…";
      })();
      try {
        await Promise.all([
          withTimeout(cameraReady, 30000, "等待相机权限超时，请允许相机后重试"),
          withTimeout(tracker.init(), 60000, "手势引擎加载超时，请检查网站资源是否完整")
        ]);
      } catch(error) {
        cancelled = true;
        throw error;
      }
      if(id !== sessionId) return;
      hand.ready = true;
      tracker.start(camEl);
    }

    function d2(a,b){
      const dx = a.x-b.x, dy = a.y-b.y;
      return Math.hypot(dx,dy);
    }

    function classifyGesture(lm){
      const wrist = lm[0];
      const fingers = [
        { tip: 8,  mcp: 5 },
        { tip: 12, mcp: 9 },
        { tip: 16, mcp: 13 },
        { tip: 20, mcp: 17 },
      ];
      let extended = 0;
      for(const f of fingers){
        const tip = lm[f.tip];
        const mcp = lm[f.mcp];
        const r = d2(tip, wrist) / Math.max(1e-6, d2(mcp, wrist));
        if(r > 1.18) extended++;
      }
      if(extended >= CFG.OPEN_EXTENDED_MIN) return "OPEN";
      if(extended <= CFG.FIST_EXTENDED_MAX) return "FIST";
      return "OTHER";
    }

    function updateHand(result, t){
      const has = !!(result?.landmarks?.length);
      if(!has){
        if(hand.detected && (t - hand.lastSeen) > CFG.HAND_LOST_MS){
          hand.detected = false;
          hand.gesture = "NONE";
          hand.bladeOn = false;
          camCtx.clearRect(0, 0, camOverlay.width, camOverlay.height);
        }
        return;
      }

      const lm = result.landmarks[0];
      const tip = lm[8];

      hand.fxT = 1.0 - tip.x;
      hand.fyT = tip.y;

      if(!hand.detected || hand.gesture === "MOUSE") {
        hand.fx = hand.fxT;
        hand.fy = hand.fyT;
        prevHandWorldValid = false;
      }

      hand.gesture = classifyGesture(lm);
      if(hand.gesture === "OPEN") hand.bladeOn = true;
      else if(hand.gesture === "FIST") hand.bladeOn = false;
      else hand.bladeOn = true;

      hand.detected = true;
      hand.lastSeen = t;

      if (CFG.CAM_OVERLAY_POINTS) drawCamOverlay(lm, hand.bladeOn);
    }

    function drawCamOverlay(lm, bladeOn){
      const w = camOverlay.width, h = camOverlay.height;
      camCtx.clearRect(0,0,w,h);
      // Match the video's object-fit: cover crop, including portrait cameras.
      const scale = Math.max(w / (camEl.videoWidth || 640), h / (camEl.videoHeight || 480));
      const vw = (camEl.videoWidth || 640) * scale;
      const vh = (camEl.videoHeight || 480) * scale;
      const offsetX = (w - vw) / 2, offsetY = (h - vh) / 2;

      const key = [0, 5, 9, 13, 17, 8, 12, 16, 20];
      camCtx.save();
      camCtx.globalCompositeOperation = "lighter";

      for(const idx of key){
        const p = lm[idx];
        const x = offsetX + (1 - p.x) * vw;
        const y = offsetY + p.y * vh;

        const isTip = (idx === 8);
        const r = isTip ? 8 : 4;

        const g = camCtx.createRadialGradient(x,y,0, x,y,r*2.2);
        g.addColorStop(0, bladeOn ? "rgba(110,255,220,.95)" : "rgba(255,200,120,.85)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        camCtx.fillStyle = g;
        camCtx.beginPath();
        camCtx.arc(x,y,r*2.2,0,Math.PI*2);
        camCtx.fill();

        camCtx.fillStyle = bladeOn ? "rgba(220,255,248,.95)" : "rgba(255,235,210,.90)";
        camCtx.beginPath();
        camCtx.arc(x,y,r,0,Math.PI*2);
        camCtx.fill();
      }

      const tip = lm[8];
      const tx = offsetX + (1 - tip.x) * vw;
      const ty = offsetY + tip.y * vh;
      camCtx.globalAlpha = 0.55;
      camCtx.strokeStyle = bladeOn ? "rgba(110,255,220,.85)" : "rgba(255,200,120,.85)";
      camCtx.lineWidth = 1.5;
      camCtx.beginPath(); camCtx.moveTo(tx-10,ty); camCtx.lineTo(tx+10,ty); camCtx.stroke();
      camCtx.beginPath(); camCtx.moveTo(tx,ty-10); camCtx.lineTo(tx,ty+10); camCtx.stroke();

      camCtx.restore();
    }

    // ============================================================
    // Gameplay state
    // ============================================================
    let started = false;
    let running = false;
    let spawnTimer = 0;
    let spawnInterval = CFG.SPAWN_BASE;

    let score = 0;
    let combo = 1;
    let bestCombo = 1;
    let misses = 0;
    const MISS_MAX = 3;

    let prevHandWorld = { x: 0, y: 0 };
    let prevHandWorldValid = false;

    let lastHudState = "";
    let fpsFrames = 0;
    let fpsLast = performance.now();

    function hitFlash(){
      flash.classList.add("on");
      setTimeout(()=>flash.classList.remove("on"), 85);
    }

    function resetGame(){
      lastHudState = "";
      for(const f of fruits){ root.remove(f.sprite); f.sprite.material.dispose?.(); }
      fruits.length = 0;
      for(const h of halves){ root.remove(h.sprite); h.sprite.material.dispose?.(); }
      halves.length = 0;
      for(const s of sparks){ sparksGroup.remove(s.sprite); s.sprite.material.dispose?.(); }
      sparks.length = 0;

      score = 0;
      combo = 1;
      bestCombo = 1;
      misses = 0;

      spawnTimer = 0;
      spawnInterval = CFG.SPAWN_BASE;

      scoreText.textContent = "0";
      comboTextEl.textContent = "x1";
      missTextEl.textContent = "0/3";

      clearTrail();
      prevHandWorldValid = false;

      running = true;
      gameOver.style.display = "none";
      flash.classList.remove("on");
    }

    function endGame(reason=""){
      running = false;
      finalScoreEl.textContent = String(score);
      bestComboEl.textContent = "x" + String(bestCombo);
      gameOver.style.display = "grid";
      scanText.textContent = reason ? reason : "GAME OVER";
    }

    // ============================================================
    // Main loop
    // ============================================================
    const clock = new THREE.Clock();

    function step(dt){
      const t = nowMs();

      // Rendering never calls detectForVideo. Smooth the latest observation
      // every display frame, independent of inference frequency.
      if(gameMode === "gesture" && hand.ready){
        updateHand(null, t);
        if(hand.detected){
          const alpha = 1 - Math.exp(-dt * 1000 / CFG.HAND_RESPONSE_MS);
          hand.fx = lerp(hand.fx, hand.fxT, alpha);
          hand.fy = lerp(hand.fy, hand.fyT, alpha);
          const w = screenToWorld(hand.fx, hand.fy);
          hand.wx = w.x;
          hand.wy = w.y;
        }
      } else if(!loading && gameMode === "mouse" && mouse.inside){
        hand.wx = mouse.x;
        hand.wy = mouse.y;
        hand.detected = true;
        hand.bladeOn = true;
        hand.gesture = "MOUSE";
        hand.lastSeen = t;
      } else {
        hand.detected = false;
        hand.bladeOn = false;
        hand.gesture = "NONE";
      }

      const bladeOn = hand.detected && hand.bladeOn;
      const hudState = `${loading}/${hand.ready}/${hand.detected}/${hand.gesture}/${bladeOn}`;
      if(hudState !== lastHudState){
        lastHudState = hudState;
        if(hand.detected){
          hud.classList.add("tracking");
          dot.classList.add("ok");
          dot.classList.remove("bad");
          scanText.textContent = "TRACKING ACTIVE";
          gestureTextEl.textContent = hand.gesture;
        } else {
          hud.classList.remove("tracking");
          dot.classList.remove("ok");
          scanText.textContent = loading ? "PREPARING CAMERA" : hand.ready ? "SCANNER IDLE" : "MOUSE MODE";
          gestureTextEl.textContent = "—";
        }

        bladeStateEl.textContent = bladeOn ? "ON" : "OFF";
        bladeStateEl.style.color = bladeOn ? "rgba(110,255,220,.95)" : "rgba(255,200,120,.9)";
        camBlade.textContent = bladeOn ? "BLADE ON" : "BLADE OFF";
        camBlade.style.borderColor = bladeOn ? "rgba(110,255,220,.25)" : "rgba(255,200,120,.25)";
        camBlade.style.color = bladeOn ? "rgba(110,255,220,.95)" : "rgba(255,200,120,.95)";
      }

      bladeCursor.position.set(hand.wx, hand.wy, 0.05);
      bladeCursor.material.opacity = bladeOn ? 0.95 : 0.0;

      let sliceSeg = null;
      let sliceSpeed = 0;

      if(bladeOn){
        pushTrailPoint(hand.wx, hand.wy, t);

        if(!prevHandWorldValid){
          prevHandWorld.x = hand.wx;
          prevHandWorld.y = hand.wy;
          prevHandWorldValid = true;
        } else {
          const dx = hand.wx - prevHandWorld.x;
          const dy = hand.wy - prevHandWorld.y;
          const dist = Math.hypot(dx, dy);
          sliceSpeed = dist / Math.max(dt, 1e-6);
          sliceSeg = { p1:{x:prevHandWorld.x,y:prevHandWorld.y}, p2:{x:hand.wx,y:hand.wy}, dx,dy,dist };
          prevHandWorld.x = hand.wx;
          prevHandWorld.y = hand.wy;
        }
      } else {
        if((t - lastTrailTime) > CFG.TRAIL_FALLBACK_HIDE_MS) clearTrail();
        prevHandWorldValid = false;
      }

      const widthTarget = CFG.TRAIL_WIDTH_BASE + clamp(sliceSpeed, 0, 2.0) * CFG.TRAIL_WIDTH_SPEED;
      trailWidth = lerp(trailWidth, widthTarget, 0.22);
      trailMat.uniforms.uAlpha.value = bladeOn ? CFG.TRAIL_ALPHA_ON : CFG.TRAIL_ALPHA_OFF;

      if(running){
        spawnTimer += dt;
        if(spawnTimer >= spawnInterval){
          spawnTimer = 0;
          spawnInterval = Math.max(CFG.SPAWN_MIN, spawnInterval * CFG.DIFFICULTY_RAMP);

          const spawnCount = (Math.random() < CFG.MULTI_CHANCE) ? 2 : 1;
          for(let i=0;i<spawnCount;i++){
            const isBomb = (Math.random() < CFG.BOMB_CHANCE);
            spawnFruit(isBomb);
          }
        }
      }

      // Update fruits
      for(let i=fruits.length-1; i>=0; i--){
        const f = fruits[i];

        f.vy += CFG.GRAVITY * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;

        // ✅ HARD TOP CLAMP: never exceed top edge
        const topLimit = CFG.WORLD_Y - f.r - CFG.TOP_MARGIN;
        if(f.y > topLimit){
          f.y = topLimit;
          // nudge downward so it doesn't "stick" at the ceiling
          if(f.vy > 0) f.vy = -Math.abs(f.vy) * CFG.TOP_BOUNCE;
        }

        f.rot += f.spin * dt;

        f.sprite.position.x = f.x;
        f.sprite.position.y = f.y;
        f.sprite.material.rotation = f.rot;

        if(running && sliceSeg && !f.sliced && sliceSpeed > CFG.SLICE_SPEED_MIN){
          if(segCircle(sliceSeg.p1, sliceSeg.p2, {x:f.x,y:f.y}, f.r)){
            f.sliced = true;

            if(f.isBomb){
              hitFlash();
              endGame("BOMB DETONATED");
            } else {
              root.remove(f.sprite);

              const dirLen = Math.max(1e-6, sliceSeg.dist);
              const dir = { dx: sliceSeg.dx/dirLen, dy: sliceSeg.dy/dirLen };
              spawnHalves(f, dir);
              spawnSparks(f.x, f.y, fruitColor(f.type));

              score += 10 * combo;
              combo = Math.min(12, combo + 1);
              bestCombo = Math.max(bestCombo, combo);

              scoreText.textContent = String(score);
              comboTextEl.textContent = "x" + String(combo);

              hitFlash();
            }

            fruits.splice(i,1);
            f.sprite.material.map = null;
            f.sprite.material.dispose?.();
          }
        }

        if(f.y < CFG.OUT_KILL_Y){
          root.remove(f.sprite);
          fruits.splice(i,1);
          f.sprite.material.map = null;
          f.sprite.material.dispose?.();

          if(running && f.missable && !f.sliced){
            misses++;
            missTextEl.textContent = `${misses}/${MISS_MAX}`;
            combo = 1;
            comboTextEl.textContent = "x1";
            if(misses >= MISS_MAX) endGame("TOO MANY MISSES");
          }
        }
      }

      // halves
      for(let i=halves.length-1; i>=0; i--){
        const h = halves[i];
        h.vy += CFG.GRAVITY * dt;
        h.x += h.vx * dt;
        h.y += h.vy * dt;
        h.rot += h.spin * dt;
        h.life -= dt;

        const topLimit = CFG.WORLD_Y - (0.10) - CFG.TOP_MARGIN;
        if(h.y > topLimit && h.vy > 0) h.vy = -Math.abs(h.vy) * 0.10;

        h.sprite.position.x = h.x;
        h.sprite.position.y = h.y;
        h.sprite.material.rotation = h.rot;
        h.sprite.material.opacity = clamp(h.life/1.2, 0, 1);

        if(h.life <= 0 || h.y < CFG.OUT_KILL_Y - 0.3){
          root.remove(h.sprite);
          halves.splice(i,1);
          h.sprite.material.map = null;
          h.sprite.material.dispose?.();
        }
      }

      // sparks
      for(let i=sparks.length-1; i>=0; i--){
        const s = sparks[i];
        s.vy += (CFG.GRAVITY * 0.55) * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.life -= dt;

        const a = clamp(s.life / CFG.SPARK_LIFE, 0, 1);
        s.sprite.position.x = s.x;
        s.sprite.position.y = s.y;
        s.sprite.material.opacity = a * 0.90;

        const sc = 0.12 * (0.55 + a*0.75);
        s.sprite.scale.set(sc, sc, 1);

        if(s.life <= 0){
          sparksGroup.remove(s.sprite);
          sparks.splice(i,1);
          s.sprite.material.map = null;
          s.sprite.material.dispose?.();
        }
      }

      renderer.render(scene, camera);

      fpsFrames++;
      const n = performance.now();
      if(n - fpsLast > 500){
        const fps = (fpsFrames * 1000) / (n - fpsLast);
        fpsText.textContent = `${fps.toFixed(0)} fps`;
        fpsFrames = 0;
        fpsLast = n;
      }
    }

    function animate(){
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());
      if(started && !document.hidden) step(dt);
    }

    // ============================================================
    // Start / Restart
    // ============================================================
    let gameMode = "mouse"; // "mouse" | "gesture"

    async function start(mode){
      if(loading) return;
      const id = ++sessionId;
      gameMode = mode || "mouse";
      banner.style.display = "none";
      overlay.style.display = "none";
      playMenuBtn.hidden = false;
      started = true;
      running = false;
      mouse.inside = false;
      hand.detected = hand.bladeOn = false;
      if(gameMode === "gesture"){
        loading = true;
        loadingPanel.hidden = false;
        try {
          await initMediaPipeAndCamera(id);
        } catch(error) {
          if(id !== sessionId) return;
          console.error("手势模式初始化失败:", error);
          backToMenu();
          dot.classList.add("bad");
          bannerMsg(cameraErrorMessage(error));
          return;
        }
        if(id !== sessionId) return;
        loading = false;
        loadingPanel.hidden = true;
      } else {
        stopCamera();
      }
      resetGame();
    }

    startBtn.addEventListener("click", () => start("mouse"));
    gestureBtn.addEventListener("click", () => start("gesture"));
    restartBtn.addEventListener("click", ()=> resetGame());
    menuBtn.addEventListener("click", ()=> backToMenu());
    playMenuBtn.addEventListener("click", backToMenu);
    document.getElementById("cancelLoadBtn").addEventListener("click", backToMenu);
    // Warm only on explicit gesture-mode interest, keeping mouse startup light.
    for(const event of ["pointerenter", "focus"]) gestureBtn.addEventListener(event, () => {
      if(window.isSecureContext && navigator.mediaDevices?.getUserMedia) tracker.init().catch(() => {});
    });

    function backToMenu(){
      sessionId++;
      lastHudState = "";
      loading = false;
      loadingPanel.hidden = true;
      playMenuBtn.hidden = true;
      mouse.inside = false;
      bladeCursor.material.opacity = 0;
      hud.classList.remove("tracking");
      // 停止游戏并清理场景
      started = false;
      running = false;
      for(const f of fruits){ root.remove(f.sprite); f.sprite.material.dispose?.(); }
      fruits.length = 0;
      for(const h of halves){ root.remove(h.sprite); h.sprite.material.dispose?.(); }
      halves.length = 0;
      for(const s of sparks){ sparksGroup.remove(s.sprite); s.sprite.material.dispose?.(); }
      sparks.length = 0;
      clearTrail();
      stopCamera();

      gameOver.style.display = "none";
      overlay.style.display = "grid";
      banner.style.display = "none";
      dot.classList.remove("ok");
      dot.classList.remove("bad");
      scanText.textContent = "SCANNER IDLE";
      gestureTextEl.textContent = "—";
      bladeStateEl.textContent = "OFF";
      scoreText.textContent = "0";
      comboTextEl.textContent = "x1";
      missTextEl.textContent = "0/3";
    }

    function stopCamera(){
      tracker.stop();
      if(cameraStream){
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      camEl.pause();
      camEl.srcObject = null;
      hand.ready = false;
      hand.detected = false;
      hand.bladeOn = false;
      camCtx.clearRect(0, 0, camOverlay.width, camOverlay.height);
      camWrap.style.display = "none";
      // Keep the initialized model for quick retries and subsequent rounds.
    }

    document.addEventListener("visibilitychange", () => {
      if(document.hidden) {
        tracker.stop();
        hand.detected = hand.bladeOn = false;
        mouse.inside = false;
        prevHandWorldValid = false;
        clearTrail();
      } else {
        clock.getDelta();
        if(started && hand.ready && !loading) tracker.start(camEl);
      }
    });
    addEventListener("pagehide", backToMenu);

    // ============================================================
    // Boot
    // ============================================================
    initThree();
    initMouseInput();
    renderer.render(scene, camera);
    animate();
    if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      document.getElementById("note").textContent = cameraErrorMessage(new Error());
    }
  </script>
</body>
</html>
